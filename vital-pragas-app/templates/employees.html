{% extends 'base.html' %}
{% block content %}
<div class="row g-4">
  <div class="col-lg-8">
    <div class="card border-0 rounded-4 shadow-sm">
      <div class="card-header bg-white rounded-top-4"><strong>Funcionários</strong></div>
      <div class="card-body table-responsive">
        <table class="table align-middle">
          <thead><tr><th>Nome</th><th>Cargo</th><th>Telefone</th><th>E-mail</th><th>Status</th></tr></thead>
          <tbody>
            {% for item in employees %}
            <tr><td>{{ item.full_name }}</td><td>{{ item.role }}</td><td>{{ item.phone }}</td><td>{{ item.email }}</td><td>{{ item.status }}</td></tr>
            {% else %}<tr><td colspan="5" class="text-muted">Sem funcionários.</td></tr>{% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card border-0 rounded-4 shadow-sm">
      <div class="card-header bg-white rounded-top-4"><strong>Novo funcionário</strong></div>
      <div class="card-body">
        <form method="post" class="vstack gap-3">
          <input class="form-control" name="full_name" placeholder="Nome completo" required>
          <input class="form-control" name="cpf" placeholder="CPF">
          <input class="form-control" name="role" placeholder="Cargo">
          <input class="form-control" name="phone" placeholder="Telefone">
          <input class="form-control" name="email" placeholder="E-mail">
          <input class="form-control" type="date" name="admission_date">
          <select class="form-select" name="status"><option>Ativo</option><option>Inativo</option></select>
          <textarea class="form-control" name="notes" placeholder="Observações"></textarea>
          <button class="btn btn-dark">Salvar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
