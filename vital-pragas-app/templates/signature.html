{% extends 'base.html' %}
{% block content %}
<div class="card border-0 rounded-4 shadow-sm mx-auto" style="max-width: 720px;">
  <div class="card-header bg-white"><strong>Assinatura registrada</strong></div>
  <div class="card-body text-center">
    <p class="text-muted">Tipo: {{ kind }} | Registro #{{ record.id }}</p>
    {% if record.signature_data %}
      <img src="{{ record.signature_data }}" class="img-fluid border rounded-4 p-2 bg-white" alt="Assinatura">
    {% else %}
      <p class="text-muted">Sem assinatura.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
