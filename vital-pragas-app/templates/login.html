<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Vital Pragas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-page d-flex align-items-center justify-content-center">
  <div class="card shadow-lg rounded-4 border-0 p-4 login-card">
    <h2 class="fw-bold mb-1">Vital Pragas</h2>
    <p class="text-muted mb-4">Controle de estoque e patrimônio</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Usuário</label>
        <input class="form-control" name="username" value="admin" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input class="form-control" name="password" type="password" value="admin123" required>
      </div>
      <button class="btn btn-dark w-100">Entrar</button>
    </form>
    <div class="small text-muted mt-3">Acesso inicial: admin / admin123</div>
  </div>
</body>
</html>
